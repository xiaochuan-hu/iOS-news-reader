[project]
name = "morning-intelligence"
version = "0.1.0"
description = "Low-latency, event-level spoken morning news briefings for iOS Shortcuts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "feedparser>=6.0.11,<7",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6.0.2,<7",
  "rapidfuzz>=3.10,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morning_intelligence"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "eval"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["morning_intelligence"]

[[tool.mypy.overrides]]
module = ["feedparser", "rapidfuzz.*"]
ignore_missing_imports = true
